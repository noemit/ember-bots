name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: packages/kiln
      - run: bun run build
      - run: bunx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: bun test ./tests/packagedOAuth.test.ts
      - run: bun run dist:cli
      - name: Verify the packaged application with a fresh profile
        run: bunx playwright test --config playwright.packaged.config.ts
        env:
          EMBER_EXPECT_MANUAL_PACKAGE: '1'
          EMBER_PACKAGED_EXECUTABLE: release/win-unpacked/Ember.exe
      - name: Stage manual Windows downloads (never advertise unsigned updates)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-manual
          Copy-Item release/Ember-windows-x64-setup.exe, release/Ember-windows-x64.zip, release/tinder-windows-x64.exe release-manual/
          Get-ChildItem release/Ember-windows-x64*.blockmap | Copy-Item -Destination release-manual/
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/release-assets.mjs checksums release-manual windows $version manual
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-x64
          path: |
            release-manual/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-diagnostics
          path: test-results/
