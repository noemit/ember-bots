name: Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PRODUCT_ROOT: ${{ github.workspace }}/product
      MANUAL_BUILDER_CONFIG: ${{ runner.temp }}/ember-manual-builder.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
      - uses: actions/checkout@v4
        with:
          ref: 2c46cb55018f5113300f4376caffc7a921e3cf30
          path: product
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert exact clean product provenance
        working-directory: product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '2c46cb55018f5113300f4376caffc7a921e3cf30') { throw 'Wrong product commit' }
          if (git status --porcelain) { throw 'Dirty product checkout' }
          git show --no-patch --format=fuller HEAD
      - run: bun install --frozen-lockfile
        working-directory: product
      - run: bun install --frozen-lockfile
        working-directory: product/packages/kiln
      - run: bun run build
        working-directory: product
      - name: Prepare external manual packaging configuration
        run: node validation/scripts/windows-manual/prepare.cjs
      - run: bunx electron-builder --win --x64 --publish never --config "$env:MANUAL_BUILDER_CONFIG"
        working-directory: product
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: bun test ./tests/packagedOAuth.test.ts ./tests/packagedCodemode.test.ts ./tests/cli.test.ts
        working-directory: product
      - name: Apply test-only overlay after product build
        shell: pwsh
        run: Copy-Item validation/e2e/launch.packaged.ts product/e2e/launch.packaged.ts
      - name: Verify packaged native launch with an isolated profile
        run: bunx playwright test --config playwright.packaged.config.ts
        working-directory: product
        env:
          EMBER_PACKAGED_EXECUTABLE: release/win-unpacked/Ember.exe
      - name: Audit packaged metadata, architectures, CLI, checksums
        run: node validation/scripts/windows-manual/audit.cjs
      - name: Assert product checkout is unchanged
        shell: pwsh
        working-directory: product
        run: |
          git restore e2e/launch.packaged.ts
          if (git status --porcelain) { throw 'Product source changed' }
          Copy-Item "$env:MANUAL_BUILDER_CONFIG" release/manual-builder-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: ember-1.23.0-windows-x64-manual-unsigned
          path: |
            product/release/*-windows-x64-setup.exe
            product/release/*-windows-x64-setup.zip
            product/release/tinder-windows-x64.exe
            product/release/SHA256SUMS-windows.txt
            product/release/MANUAL-WINDOWS.txt
            product/release/manual-builder-config.json
            product/test-results/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-manual-diagnostics
          path: product/test-results/
